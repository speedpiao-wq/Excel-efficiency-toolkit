name: 问题反馈
description: 报告加载项未生效、报错或格式不正确
title: "[问题] "
labels: ["bug", "needs-triage"]
body:
  - type: input
    id: version
    attributes:
      label: 加载项版本
      placeholder: 例如：v0.1.0
    validations:
      required: true
  - type: input
    id: excel
    attributes:
      label: Excel 与 Windows 版本
      placeholder: 例如：Microsoft 365 Excel / Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重现步骤
      placeholder: "1. ……\n2. ……\n3. ……"
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认上传的截图或文件已经脱敏
          required: true
