<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Excel 职场减负工具箱｜社区入口</title>
  <style>
    :root{--g:#107c41;--g2:#eaf7ef;--ink:#17241d;--muted:#607168;--line:#d7e5dc;--bg:#f3f7f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei UI","Segoe UI",sans-serif;line-height:1.7}.wrap{max-width:960px;margin:auto;padding:40px 20px}header{text-align:center;margin-bottom:24px}h1{font-size:34px;margin:8px}.lead{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 10px 28px rgba(20,70,40,.06)}.qr{display:block;width:min(100%,410px);margin:14px auto;border:1px solid var(--line);border-radius:16px}.status{text-align:center;background:var(--g2);color:var(--g);padding:10px;border-radius:10px;font-weight:700}.buttons{display:grid;gap:12px;margin-top:20px}.button{display:block;text-decoration:none;background:var(--g);color:#fff;padding:13px 16px;border-radius:11px;text-align:center;font-weight:800}.button.alt{background:var(--g2);color:var(--g);border:1px solid var(--line)}.small{color:var(--muted);font-size:13px}.warning{border-left:5px solid #efb400;background:#fff8dd;padding:12px 14px;border-radius:8px}@media(max-width:760px){.grid{grid-template-columns:1fr}h1{font-size:28px}}
  </style>
</head>
<body><div class="wrap"><header><div>稳定入口 · 二维码可以更换，页面地址不变</div><h1>微信群与需求交流</h1><p class="lead">所有教程、Release 和分享海报只需要指向本页面。</p></header><div class="grid"><section class="panel"><h2>当前微信群二维码</h2><img id="qr" class="qr" src="assets/wechat-group-placeholder.svg" alt="微信群二维码"><div id="status" class="status">正在读取二维码状态……</div><p id="updated" class="small"></p></section><section class="panel"><h2>二维码过期也能联系</h2><p>微信群适合即时聊天；GitHub 适合沉淀可检索的需求、投票和版本记录。两者同时保留，入口才不会因为二维码过期而完全失效。</p><div class="buttons"><a id="feature" class="button" href="#">提交功能需求</a><a id="issues" class="button alt" href="#">查看已有需求</a><a id="discussions" class="button alt" href="#">进入 GitHub Discussions</a></div><p class="warning">请勿上传包含客户资料、财务数据、人事信息或其他敏感内容的工作簿。需要示例时先脱敏。</p></section></div></div>
  <script>
    (()=>{const parts=location.pathname.split('/').filter(Boolean);const owner=location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]:null;const repo=parts[0];const base=owner&&repo?`https://github.com/${owner}/${repo}`:'#';document.getElementById('feature').href=base==='#'?'#':`${base}/issues/new?template=feature_request.yml`;document.getElementById('issues').href=base==='#'?'#':`${base}/issues`;document.getElementById('discussions').href=base==='#'?'#':`${base}/discussions`;fetch(`community.json?t=${Date.now()}`).then(r=>r.json()).then(c=>{document.getElementById('qr').src=c.qr_image;const status=document.getElementById('status');status.textContent=c.message||'二维码状态未说明';if(c.valid_until){status.textContent=`二维码预计有效至：${c.valid_until}`;}document.getElementById('updated').textContent=`最后更新：${c.updated_at||'未知'}`;}).catch(()=>{document.getElementById('status').textContent='暂时无法读取二维码状态，请使用右侧 GitHub 入口。';});})();
  </script>
</body></html>
